services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: posq
      POSTGRES_PASSWORD: posq_dev
      POSTGRES_DB: posq
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U posq -d posq"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
